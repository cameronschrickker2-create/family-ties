<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Northside · Admin</title>
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/base.css">
<style>
body{background:var(--surface)}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--ink);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
aside .brand{padding:4px 8px 18px}
aside .brand .mark{background:var(--lime)} aside .brand .mark span{color:var(--ink)}
aside button{all:unset;cursor:pointer;padding:11px 12px;border-radius:10px;font-weight:600;display:flex;justify-content:space-between;align-items:center;color:#C9D4CD}
aside button.on,aside button:hover{background:var(--ink-2);color:#fff}
aside button .n{background:var(--lime);color:var(--ink);border-radius:999px;font-size:12px;padding:2px 8px;font-weight:800}
aside .foot{margin-top:auto;font-size:12px;color:#7F918A;padding:8px}
main{padding:20px 24px;min-width:0}
.head{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.head h1{margin:0;font-size:24px;margin-right:auto}
.toggle{display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:6px 6px 6px 14px;font-weight:700;border:1px solid var(--line)}
.toggle button{border:0;border-radius:999px;padding:8px 14px;font-weight:800;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:#fff;border-radius:14px;padding:14px 16px;border:1px solid var(--line)}
.stat small{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.stat b{display:block;font-size:26px;margin-top:4px}
.board{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:12px;overflow-x:auto;padding-bottom:10px}
.col{background:#E9ECE6;border-radius:14px;padding:10px;min-height:300px}
.col h3{margin:4px 6px 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between}
.oc{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid var(--line);cursor:pointer;font-size:14px}
.oc.new{animation:ring 1s ease-in-out 3;border-color:var(--lime);box-shadow:0 0 0 3px var(--lime)}
@keyframes ring{50%{box-shadow:0 0 0 7px rgba(198,255,61,.5)}}
.oc .r{display:flex;justify-content:space-between;align-items:center;gap:6px}
.oc .code{font-weight:800}
.oc .ago{font-size:12px;color:var(--muted)}
.oc .items{color:var(--muted);font-size:13px;margin:6px 0}
.oc .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.oc .acts .btn{flex:1;padding:9px 10px;font-size:13px}
.oc select{width:100%;margin-top:8px;padding:8px;border-radius:8px;border:1px solid var(--line);background:#fff}
.panel{background:#fff;border-radius:14px;border:1px solid var(--line);padding:16px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface)}
.drawer-wrap{position:fixed;inset:0;background:rgba(11,20,16,.4);z-index:500;display:flex;justify-content:flex-end}
.drawer{width:min(560px,100%);height:100%;background:#fff;overflow:auto;padding:22px;box-shadow:-10px 0 40px rgba(0,0,0,.2);animation:slide .2s}
@keyframes slide{from{transform:translateX(40px);opacity:.5}}
.drawer h2{margin:0 0 4px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:14px;margin:12px 0}
.kv span{color:var(--muted)}
.tl{list-style:none;padding:0;margin:0;font-size:13px}
.tl li{padding:6px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between}
.minimap{height:220px;border-radius:12px;overflow:hidden;margin:12px 0}
#bigmap{height:calc(100vh - 140px);border-radius:14px;overflow:hidden}
.st{font-size:11px;font-weight:800;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:var(--surface)}
.st.placed{background:#FFF0C2}.st.accepted{background:#DDEBFF}.st.packed{background:#EADCFF}.st.out_for_delivery{background:var(--lime)}.st.delivered{background:#DDF5E5}.st.cancelled{background:#FCE9E7;color:var(--danger)}
.optbox{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.choicerow{display:grid;grid-template-columns:1fr 110px 36px;gap:6px;margin-bottom:6px}
.login{max-width:380px;margin:12vh auto;background:#fff;border-radius:20px;padding:26px}
.dpin{width:30px;height:30px;border-radius:50%;background:var(--lime);border:3px solid var(--ink);display:grid;place-items:center;font-size:14px}
.opin{width:22px;height:22px;border-radius:50% 50% 50% 3px;transform:rotate(-45deg);background:var(--ink);border:2px solid #fff}
@media(max-width:820px){.shell{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;overflow-x:auto}aside .brand,aside .foot{display:none}main{padding:14px}}
</style>
</head>
<body>
<div id="root"></div>
<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/admin.js"></script>
</body>
</html>
